name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -q
      - name: Run bridge tests
        run: node --test test_bridge.cjs

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Windows x64 archive
        shell: pwsh
        run: .\build.ps1
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SessionRelay-Windows-x64.zip
            dist/SHA256SUMS.txt
